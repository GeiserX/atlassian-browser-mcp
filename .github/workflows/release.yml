name: Release

# A tag v* publishes the package to PyPI and then lists that version in the MCP
# Registry. PyPI trusts GitHub's OIDC token for this repository, workflow and
# environment (a trusted publisher on pypi.org), so there is no API token to
# store or rotate.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    # The tag, pyproject.toml, uv.lock and server.json must name the same
    # version, or PyPI and the registry would point at a release that does not
    # match the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches pyproject.toml, uv.lock and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          py=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          lock=$(python3 -c 'import tomllib;print(next(p["version"] for p in tomllib.load(open("uv.lock","rb"))["package"] if p["name"]=="atlassian-browser-mcp"))')
          sj=$(jq -r .version server.json)
          sp=$(jq -r '.packages[0].version' server.json)
          for pair in "pyproject.toml=$py" "uv.lock=$lock" "server.json=$sj" "server.json packages[0]=$sp"; do
            if [ "${pair#*=}" != "$v" ]; then
              echo "::error::${pair%%=*} says ${pair#*=}, the tag says $v"
              exit 1
            fi
          done

  build:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
      - name: Build the sdist and wheel
        run: uv build
      # The registry proves ownership of a PyPI package by reading
      # "mcp-name: <server name>" in the package description. Stop here if the
      # README that becomes that description lost the line.
      - name: The package description carries the registry name
        run: python3 .github/scripts/check-mcp-name.py dist/*.tar.gz server.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          # A version already on PyPI is skipped, so a failed release can be
          # re-run after the missing piece is fixed.
          skip-existing: true

  mcp-registry:
    needs: pypi-publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
