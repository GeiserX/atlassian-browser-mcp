name: Track upstream mcp-atlassian

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Everything that comes from upstream (tag name, release URL, release notes) is
# untrusted text. It never appears inside a `run:` script as ${{ }}: values go
# through env vars after validation, and the release notes only ever travel
# through files, so backticks or $(...) in them are never executed.

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get current pin
        id: current
        run: |
          PIN=$(grep 'mcp-atlassian' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CONSTRAINT=$(grep -oE '"mcp-atlassian[^"]*"' pyproject.toml | head -1 | tr -d '"' | sed 's/^mcp-atlassian//')
          [[ "$PIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected pin: $PIN" >&2; exit 1; }
          [[ "$CONSTRAINT" =~ ^[0-9.,\<\>=!\ ]+$ ]] || { echo "unexpected constraint" >&2; exit 1; }
          echo "version=$PIN" >> "$GITHUB_OUTPUT"
          echo "constraint=$CONSTRAINT" >> "$GITHUB_OUTPUT"
          echo "Current pin: $PIN ($CONSTRAINT)"

      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/sooperset/mcp-atlassian/releases/latest > "$RUNNER_TEMP/release.json"
          LATEST=$(jq -r '.tag_name' "$RUNNER_TEMP/release.json" | sed 's/^v//')
          URL=$(jq -r '.html_url' "$RUNNER_TEMP/release.json")
          # Only a plain x.y.z version and a github.com release URL are accepted;
          # anything else stops the job instead of flowing into commands.
          [[ "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected upstream tag" >&2; exit 1; }
          [[ "$URL" =~ ^https://github\.com/sooperset/mcp-atlassian/releases/tag/[A-Za-z0-9._-]+$ ]] || { echo "unexpected release URL" >&2; exit 1; }
          jq -r '.body // ""' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/upstream-notes.md"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Latest upstream: $LATEST"

      - name: Compare versions
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.upstream.outputs.version }}
        run: |
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "${CURRENT%%.*}" != "${LATEST%%.*}" ]; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          else
            echo "bump=minor-or-patch" >> "$GITHUB_OUTPUT"
          fi
          echo "New version available: $CURRENT -> $LATEST"

      - name: Check for existing issue
        if: steps.compare.outputs.changed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.upstream.outputs.version }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "upstream mcp-atlassian $LATEST in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Issue #$EXISTING already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        with:
          version: '0.13.6'
          python-version: '3.13'

      # Runs the wrapper's own test suite against the new upstream, so the
      # verdict covers the patched clients' behaviour (hardening kept, cookies
      # sent, tools annotated), not only the patched signatures.
      - name: Test compatibility
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        id: compat
        env:
          LATEST: ${{ steps.upstream.outputs.version }}
        run: |
          set +e
          {
            uv venv -q "$RUNNER_TEMP/venv" &&
            uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" -e '.[dev]' "mcp-atlassian==$LATEST" &&
            "$RUNNER_TEMP/venv/bin/python" -c 'from importlib.metadata import version; from atlassian_browser_mcp_full import assert_upstream_compatibility as a; a(); print("mcp-atlassian", version("mcp-atlassian"), "signatures OK")' &&
            "$RUNNER_TEMP/venv/bin/python" -m pytest -q 2>&1 | tail -25
            test "${PIPESTATUS[0]}" -eq 0
          } > "$RUNNER_TEMP/compat-report.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/compat-report.txt"
          if [ "$rc" -eq 0 ]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.current.outputs.version }}
          CONSTRAINT: ${{ steps.current.outputs.constraint }}
          LATEST: ${{ steps.upstream.outputs.version }}
          RELEASE_URL: ${{ steps.upstream.outputs.url }}
          BUMP_TYPE: ${{ steps.compare.outputs.bump }}
          COMPATIBLE: ${{ steps.compat.outputs.compatible }}
        run: |
          if [ "$COMPATIBLE" = "true" ]; then
            COMPAT_LABEL="compatible"; COMPAT_ICON="white_check_mark"
            COMPAT_MSG="The patched signatures and the full test suite pass against this version. Safe to bump."
          else
            COMPAT_LABEL="breaking"; COMPAT_ICON="x"
            COMPAT_MSG="**The compatibility check or the test suite failed** against this version; see the report."
          fi
          if [ "$BUMP_TYPE" = "minor-or-patch" ]; then
            PRIORITY="Already satisfies our \`$CONSTRAINT\` constraint. Raising the floor (and refreshing uv.lock) is a manual PR, and that is what this issue is for."
          else
            PRIORITY="**Major version change**, outside our \`$CONSTRAINT\` constraint. Manual update required."
          fi

          body="$RUNNER_TEMP/issue.md"
          {
            printf '## New upstream release: mcp-atlassian %s\n\n' "$LATEST"
            printf '|  |  |\n|---|---|\n'
            printf '| **Current pin** | `%s` |\n| **New version** | `%s` |\n' "$CURRENT" "$LATEST"
            printf '| **Bump type** | `%s` |\n| **Compatible** | :%s: |\n\n' "$BUMP_TYPE" "$COMPAT_ICON"
            printf '%s\n\n### Compatibility report\n\n```\n' "$PRIORITY"
            cat "$RUNNER_TEMP/compat-report.txt"
            printf '```\n\n:%s: %s\n\n### Upstream changelog\n\n' "$COMPAT_ICON" "$COMPAT_MSG"
            cat "$RUNNER_TEMP/upstream-notes.md"
            printf '\n\nRelease: %s\n\n' "$RELEASE_URL"
            printf '### Checklist\n\n'
            printf -- '- [ ] Review upstream changelog for relevant changes\n'
            printf -- '- [ ] Update version pin in `pyproject.toml` and run `uv lock`\n'
            printf -- '- [ ] Update `assert_upstream_compatibility()` if the major changed\n'
            printf -- '- [ ] Update monkey-patches if signatures changed\n'
            printf -- '- [ ] Check whether upstream now allows mcp>=2 / fastmcp>=4 (MCP 2026-07-28)\n'
          } > "$body"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "upstream: mcp-atlassian $LATEST" \
            --label "upstream,$COMPAT_LABEL" \
            --body-file "$body"
