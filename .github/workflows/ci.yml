name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job installs and runs repository code, including from
          # fork PRs. Nothing here pushes, so the token has no reason to
          # stay in .git/config where that code could reach it.
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails if uv.lock no longer matches pyproject.toml, so a
      # dependency change cannot land without its lockfile.
      - name: Install the locked dependencies
        run: uv sync --locked --extra dev

      - name: Tests
        run: uv run --no-sync python -m pytest -q

      # The wrapper monkey-patches four upstream functions. This asserts the
      # version we actually pin still has the signatures those patches expect,
      # the same check the server runs at startup.
      - name: Upstream compatibility (against the locked mcp-atlassian)
        run: |
          uv run --no-sync python - <<'PY'
          from importlib.metadata import version
          from atlassian_browser_mcp_full import assert_upstream_compatibility

          assert_upstream_compatibility()
          print(f"mcp-atlassian {version('mcp-atlassian')}: patched signatures OK")
          PY
