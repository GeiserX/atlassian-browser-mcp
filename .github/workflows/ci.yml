name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its pinned upstream
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Tests
        run: python -m pytest tests/ -q

      # The wrapper monkey-patches four upstream functions. This asserts the
      # version we actually pin still has the signatures those patches expect —
      # the same check the server runs at startup, so a bad bump fails here
      # instead of at someone's first tool call.
      - name: Upstream compatibility (against the pinned mcp-atlassian)
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from atlassian_browser_mcp_full import assert_upstream_compatibility

          assert_upstream_compatibility()
          print(f"mcp-atlassian {version('mcp-atlassian')}: patched signatures OK")
          PY
