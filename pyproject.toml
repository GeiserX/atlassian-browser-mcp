[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlassian-browser-mcp"
version = "1.5.0"
description = "Browser-backed MCP server wrapping upstream mcp-atlassian with Playwright SSO auth"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "GeiserX" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp-atlassian>=0.24.3,<1.0.0",
    "playwright>=1.58.0",
    "requests>=2.33.1",
    # 44.0.1 carries the fixes for CVE-2024-26130 and the bundled-OpenSSL
    # CVE-2024-12797.
    "cryptography>=44.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/GeiserX/atlassian-browser-mcp"
Repository = "https://github.com/GeiserX/atlassian-browser-mcp"
Issues = "https://github.com/GeiserX/atlassian-browser-mcp/issues"

[project.scripts]
atlassian-browser-mcp = "atlassian_browser_mcp_full:main"
atlassian-cli = "atlassian_cli:main"

[tool.setuptools]
py-modules = [
    "atlassian_browser_auth",
    "atlassian_browser_mcp_full",
    "atlassian_cli",
    "cookie_harvest",
    "cookie_autoauth",
]

[tool.uv]
# mcp-atlassian 0.24.1 caps cryptography below 47 but never imports it. 46.x
# has published advisories fixed in 50.0.0, so the lock overrides the cap.
# This covers the lock only; uvx and pip installs follow upstream's cap.
override-dependencies = ["cryptography>=50.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
